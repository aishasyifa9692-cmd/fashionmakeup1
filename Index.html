function render(p){$('#char').innerHTML=fig(S,tab=='makeup'?FACE:FULL);$('#exp').innerHTML=expH();if(p){const e=$('#stage');e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop');spark()}rPanel();upd()}
function rPanel(){const cs=cats();if(!cs.find(c=>c.k==cat))cat=cs[0].k;const c=cs.find(x=>x.k==cat);
 $('#tabs').innerHTML=[['makeup','💄 Makeup'],['hair','💇‍♀️ Hair'],['dress','👗 Dress Up']].map(t=>`<button class="tb ${t[0]==tab?'sel':''}" data-t="${t[0]}">${t[1]}</button>`).join('');
 $('#cats').innerHTML=cs.map(x=>`<button class="cc ${x.k==cat?'sel':''}" data-k="${x.k}">${x.e}<small>${x.n}</small></button>`).join('');
 $('#opts').innerHTML=c.o.map((o,i)=>`<button class="op ${c.sel(o[0])?'sel':''}" data-i="${i}">${o[3]&&!un(c.k+':'+o[0],o[3])?'<i>🔒</i>':''}${sw(o)}<small>${o[1]}</small></button>`).join('');
 let t=null;if(tab=='dress'&&lastI&&S.w[I[lastI].s]==lastI)t=I[lastI].n;else if(tab=='hair'&&c.k=='ha'&&S.h.a&&S.h.a!='crown')t='aksesori';
 $('#palw').innerHTML=t?`<div class="pal"><b>🎨 Warna ${t}</b>${PAL.map(x=>`<button class="pc" data-c="${x}" style="background:${x}"></button>`).join('')}</div>`:''}
function pick(i){const c=cats().find(x=>x.k==cat),o=c.o[i],k=c.k+':'+o[0];if(o[3]&&!un(k,o[3])){const cost=o[3]*15;return modal(`<h3>🔒 ${o[1]}</h3><p>Item terkunci! Kumpulkan ${o[3]}⭐ dari challenge, atau buka sekarang dengan ${cost}🪙.</p>`,[['Buka ('+cost+'🪙)',()=>{if(G.coins>=cost){G.coins-=cost;G.un.push(k);sv();upd();rPanel();toast('Item terbuka! 🎉')}else toast('Koin belum cukup 🪙')}],['Nanti',null,'lv']])}act(()=>c.set(o[0]))}
function step(d){const c=cats().find(x=>x.k==cat),L=c.o.length;let i=c.o.findIndex(o=>c.sel(o[0]));for(let n=0;n<L;n++){i=(i+d+L)%L;const o=c.o[i];if(un(c.k+':'+o[0],o[3]))return pick(i)}}
$('#panel').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.t){tab=d.t;cat=cats()[0].k;render()}else if(d.k){cat=d.k;rPanel()}else if(d.i!=null)pick(+d.i);else if(d.c)act(()=>{if(tab=='hair')S.h.ac=d.c;else S.col[lastI]=d.c});else if(b.id=='prev')step(-1);else if(b.id=='next')step(1)};
$('#exp').onclick=$('#pexp').onclick=e=>{const b=e.target.closest('[data-e]');if(b){act(()=>S.ex=b.dataset.e);cur=='photo'&&rPhoto()}};
$('.tools').onclick=e=>{const t=e.target.closest('[data-t]')?.dataset.t;if(t=='undo'){if(H.length){S=JSON.parse(H.pop());render(1)}else toast('Belum ada yang di-undo')}
 else if(t=='reset')act(()=>S=newState(S.ch));else if(t=='rnd')rnd();else if(t=='save')saveLook();else if(t=='photo')go('photo')};
function rnd(){act(()=>{S.h.s=pk(HCS[0].o)[0];S.h.c=pk(HCL);S.h.b=pk(HCS[2].o)[0];S.h.a=pk([null,'bow','clip','band','flower']);S.h.ac=pk(PAL);
 MKC.forEach(c=>{if(c.k!='fd'){const o=c.o.filter(x=>un(c.k+':'+x[0],x[3]));S.mk[c.k]=pk(o)[0]}});
 const u=g=>Object.values(I).filter(x=>x.g==g&&un(g+':'+x.id,x.l));S.w={};S.col={};
 if(Math.random()<.4)S.w.dress=pk(u('dress')).id;else{S.w.top=pk(u('top')).id;S.w.bottom=pk(u('bottom')).id}
 S.w.shoes=pk(u('shoes')).id;if(Math.random()<.5)S.w.jacket=pk(u('jacket')).id;if(Math.random()<.6)S.w.bag=pk(u('bag')).id;
 u('jewel').forEach(x=>{if(Math.random()<.5)S.w[x.s]=x.id});if(Math.random()<.15)S.w.hijab=pk(u('hijab')).id;
 Object.values(S.w).forEach(id=>{if(Math.random()<.7)S.col[id]=pk(PAL)})});toast('Gaya acak! 🎲')}
function saveLook(p){G.saves.unshift({s:clone(S),p:p||null});G.saves=G.saves.slice(0,12);G.coins+=10;sv();upd();toast('Look tersimpan! +10🪙')}
/* ---------- CHALLENGES ---------- */
const wn=s=>Object.values(s.w).map(i=>I[i]),tg=(s,t)=>wn(s).filter(x=>x.tg.includes(t)).length,inn=(v,a)=>a.includes(v);
const FC=[{n:'Korean Street Style',e:'🇰🇷',cr:[['2 item bergaya Korea',s=>tg(s,'korean')>=2],['Pakai sepatu',s=>!!s.w.shoes],['Bawa tas',s=>!!s.w.bag]]},
{n:'Elegant Evening',e:'🌙',cr:[['2 item elegan',s=>tg(s,'elegant')>=2],['Pakai High Heels',s=>s.w.shoes=='heels'],['Kalung/anting',s=>!!(s.w.neck||s.w.ear)]]},
{n:'Cute & Sweet',e:'🍭',cr:[['2 item imut',s=>tg(s,'cute')>=2],['Aksesori rambut',s=>!!s.h.a],['Bawa tas',s=>!!s.w.bag]]},
{n:'Casual Day Out',e:'☀️',cr:[['2 item casual',s=>tg(s,'casual')>=2],['Pakai sneakers',s=>s.w.shoes=='sneak'],['Tanpa dress',s=>!s.w.dress]]},
{n:'Modest Chic',e:'🧕',cr:[['Pakai hijab',s=>!!s.w.hijab],['Item modest',s=>tg(s,'modest')>=2],['Pakai sepatu',s=>!!s.w.shoes]]}];
const MCH=[{n:'Natural Glow',e:'🌿',cr:[['Lipstick nude/peach',s=>inn(s.mk.lip,['#d9a58f','#ff9a7a'])],['Pakai blush',s=>!!s.mk.blush],['Tanpa glitter',s=>!s.mk.glit]]},
{n:'Party Glam',e:'🪩',cr:[['Pakai glitter',s=>!!s.mk.glit],['Bulu mata dramatis',s=>s.mk.lash=='dram'],['Lipstik merah/berry/ungu',s=>inn(s.mk.lip,['#e0223c','#a3204a','#a04cc0'])]]},
{n:'Sweet Pink',e:'🌸',cr:[['Lipstik pink',s=>s.mk.lip=='#ff7fae'],['Blush pink/rose',s=>inn(s.mk.blush,['#ff8fb1','#e8607f'])],['Eyeshadow pink',s=>s.mk.shadow=='#ffb3d1']]},
{n:'Purple Dream',e:'🔮',cr:[['Eyeshadow ungu/lavender',s=>inn(s.mk.shadow,['#9b5de5','#c9a7ff'])],['Lensa ungu',s=>s.mk.lens=='#9b5de5'],['Lipstik ungu/plum',s=>inn(s.mk.lip,['#a04cc0','#7a2a5a'])]]},
{n:'Cat Eye Queen',e:'😼',cr:[['Eyeliner wing',s=>!!s.mk.liner&&s.mk.liner.startsWith('wing')],['Bulu mata dipasang',s=>s.mk.lash!='none'],['Alis arch',s=>s.mk.brow.startsWith('arch')]]}];
const PC={n:'Party Preparation',e:'🎉',cr:[['Gaun/Party Dress',s=>inn(s.w.dress,['gown','party'])],['Pakai heels',s=>s.w.shoes=='heels'],['Kalung/anting',s=>!!(s.w.neck||s.w.ear)],['Pakai lipstik',s=>!!s.mk.lip],['Glitter/highlighter',s=>!!(s.mk.glit||s.mk.hl)],['Aksesori rambut',s=>!!s.h.a]]};
function newChal(){chal=mode=='fashion'?pk(FC.filter(x=>x!==chal)):mode=='makeup'?pk(MCH.filter(x=>x!==chal)):PC}
function judge(){const ok=chal.cr.map(c=>c[1](S)),r=ok.filter(Boolean).length/ok.length,st=Math.round(r*3),co=Math.round(r*40)+(st==3?20:0),o=G.stars;G.stars+=st;G.coins+=co;sv();upd();
 const nu=[...HCS,...DRC].flatMap(c=>c.o.filter(x=>x[3]&&x[3]>o&&x[3]<=G.stars).map(x=>x[1]));
 modal(`<h3>${chal.e} ${chal.n}</h3><div class="st">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div><ul>${chal.cr.map((c,i)=>`<li>${ok[i]?'✅':'❌'} ${c[0]}</li>`).join('')}</ul><p><b>+${co}🪙 +${st}⭐</b></p>${st==3?'<p>Sempurna! Kamu fashionista sejati 👑</p>':'<p>Coba lengkapi kriteria yang belum terpenuhi!</p>'}${nu.length?`<p>🔓 Item terbuka: ${nu.join(', ')}</p>`:''}`,[['Lanjut dandan',null],...(mode=='party'?[]:[['Tema baru',()=>{newChal();rStudio()},'lv']])])}
/* ---------- PHOTO ---------- */
const BG=[['Salon Pink','#ffd1e8','#fff0f8'],['Lavender','#d9c8ff','#f3ecff'],['Baby Blue','#bfe4ff','#eef8ff'],['Runway','#ffe3b8','#ffc2d9'],['Bintang','#6d5bb0','#c9a7ff']],FR=['','💖','⭐','🌸'];
function rPhoto(){const b=BG[PB];$('#pstage').style.background=`linear-gradient(${b[1]},${b[2]})`;$('#pchar').innerHTML=fig(S,FULL);$('#pexp').innerHTML=expH();
 $('#pfr').innerHTML=FR[PF]?`<div>${FR[PF].repeat(14)}</div><div>${FR[PF].repeat(14)}</div>`:'';
 $('#pbg').innerHTML=BG.map((b,i)=>`<button class="op ${i==PB?'sel':''}" data-b="${i}" style="background:linear-gradient(${b[1]},${b[2]});width:74px"><small>${b[0]}</small></button>`).join('');
 $('#pfm').innerHTML=FR.map((f,i)=>`<button class="op ${i==PF?'sel':''}" data-f="${i}" style="width:74px"><span class="em">${f||'⬜'}</span><small>${f?'Bingkai':'Polos'}</small></button>`).join('')}
$('#pbg').onclick=e=>{const b=e.target.closest('[data-b]');if(b){PB=+b.dataset.b;rPhoto()}};$('#pfm').onclick=e=>{const b=e.target.closest('[data-f]');if(b){PF=+b.dataset.f;rPhoto()}};
$('#snap').onclick=()=>{const W=600,H2=800,cv=document.createElement('canvas');cv.width=W;cv.height=H2;const x=cv.getContext('2d'),b=BG[PB],g=x.createLinearGradient(0,0,0,H2);g.addColorStop(0,b[1]);g.addColorStop(1,b[2]);x.fillStyle=g;x.fillRect(0,0,W,H2);
 const img=new Image();img.onload=()=>{const ih=730,iw=ih*200/345;x.drawImage(img,(W-iw)/2,35,iw,ih);if(FR[PF]){x.font='38px serif';x.textAlign='center';for(let i=0;i<10;i++){x.fillText(FR[PF],30+i*60,40);x.fillText(FR[PF],30+i*60,H2-10)}}
  x.font='bold 22px sans-serif';x.textAlign='center';x.fillStyle='rgba(120,70,150,.85)';x.fillText('GLAMOUR GIRL 💖 '+CH[S.ch].n,W/2,H2-48);const u=cv.toDataURL('image/jpeg',.8);
  modal(`<h3>📸 Hasil Foto!</h3><img src="${u}" alt="Foto" style="max-width:100%;max-height:50vh;border-radius:16px"><p style="font-size:12px">Tekan lama gambar untuk menyimpan ke perangkat.</p>`,[['💾 Simpan ke Koleksi',()=>saveLook(u)],['⬇️ Unduh',()=>{const a=document.createElement('a');a.href=u;a.download='glamour-girl.jpg';a.click()},'bb'],['Tutup',null,'lv']])};
 img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(fig(S,FULL).replace('<svg ','<svg width="400" height="690" '))};
/* ---------- COLLECTION ---------- */
function rColl(){$('#coll').innerHTML=G.saves.length?G.saves.map((x,i)=>`<div class="card"><div class="cf">${x.p?`<img src="${x.p}" alt="">`:fig(x.s,FULL)}</div><b>${CH[x.s.ch].n}</b><div class="prow"><button class="btn sm" data-u="${i}">Pakai</button><button class="btn sm lv" data-x="${i}">🗑</button></div></div>`).join(''):'<p style="text-align:center;grid-column:1/-1">Belum ada look. Buat dandananmu lalu tekan 💾 Save Look!</p>'}
$('#coll').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.u!=null){H=[];S=clone(G.saves[b.dataset.u].s);start('free','dress')}else if(b.dataset.x!=null){G.saves.splice(b.dataset.x,1);sv();rColl()}};
upd();go('open');
</script></body></html>
